<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORJN — Concierge Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0A0A0A;
      color: #FFFFFF;
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      overflow-x: hidden;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(255,255,255,0.012) 3px,
        rgba(255,255,255,0.012) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
    }

    .terminal {
      max-width: 560px;
      width: 100%;
      border: 2px solid #333333;
      background: #141414;
      padding: 0;
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid #333333;
      background: #0A0A0A;
    }

    .terminal-bar span {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #444444;
      font-family: 'Inter', monospace;
    }

    .terminal-dot {
      width: 5px;
      height: 5px;
      background: #C6FF2E;
      animation: blink 2.4s ease-in-out infinite;
    }

    .terminal-body {
      padding: 32px 32px 40px;
    }

    .eyebrow {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: #888888;
      font-family: 'Inter', monospace;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Jost', sans-serif;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 900;
      line-height: 0.92;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
    }

    h1 em {
      font-style: normal;
      color: #C6FF2E;
    }

    .desc {
      font-size: 12px;
      line-height: 1.75;
      color: #888888;
      max-width: 400px;
      font-family: 'Inter', monospace;
      letter-spacing: 0.03em;
      border-left: 2px solid #333333;
      padding-left: 16px;
    }

    .tag {
      display: inline-block;
      margin-top: 28px;
      padding: 8px 14px;
      border: 1px solid #333333;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #C6FF2E;
      font-family: 'Inter', monospace;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <main>
    <div class="terminal">
      <div class="terminal-bar">
        <div class="terminal-dot"></div>
        <span>SYS.DIR // WIDGET PREVIEW // LOCAL</span>
      </div>
      <div class="terminal-body">
        <p class="eyebrow">ORJN Digital Flagship — 2026</p>
        <h1>Drop<br><em>Intel</em><br>Terminal</h1>
        <p class="desc">
          The embeddable concierge widget loads from the launcher in the bottom-right corner.
          Open it to query the live catalog — product intel, sizes, sourcing, and archive pricing.
        </p>
        <span class="tag">↘ Launch the concierge</span>
      </div>
    </div>
  </main>
  <div id="orjn-concierge-root"></div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
